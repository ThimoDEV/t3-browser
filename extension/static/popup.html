<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>T3 Browser</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header>
    <div class="brand"><img src="icons/icon48.png" alt="" width="20" height="20" /> T3 Browser</div>
    <span id="status" class="status">…</span>
  </header>

  <section>
    <div class="row-head">
      <h2>Agent threads</h2>
      <button id="stop-all" class="ghost small" hidden>Stop all</button>
    </div>
    <ul id="sessions" class="list"></ul>
    <p id="no-sessions" class="muted">No agent is using the browser. Ask an agent in T3 Code to do something on the web.</p>
  </section>

  <section>
    <h2>Site access</h2>
    <label class="toggle">
      <input type="checkbox" id="trusted" />
      <span>Let agents use any site without asking</span>
    </label>
    <ul id="origins" class="list compact"></ul>
  </section>

  <footer class="muted">
    <span id="version"></span> · Esc on a controlled tab stops the agent
  </footer>
  <script src="popup.js"></script>
</body>
</html>
